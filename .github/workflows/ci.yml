name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # FIGlet interoperability tests run where FIGlet has a maintained package.
      # REQUIRE_FIGLET=1 turns a missing figlet into a test failure instead of a skip.
      - name: Install FIGlet (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y figlet

      - name: Install FIGlet (macOS)
        if: runner.os == 'macOS'
        run: brew install figlet

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build
        env:
          REQUIRE_FIGLET: ${{ runner.os != 'Windows' && '1' || '' }}
